# Kiosk config -- fullscreen, no border, no gaps, no animation, matching
# weston's old kiosk-shell behavior (forces every toplevel fullscreen
# regardless of what it requests). Used for vpinball/vpinfe/the debug
# Chrome option -- everything except client_name "installer"/"vpxconfig",
# which get hyprland-installer.conf instead (see launch.sh).
#
# Xwayland stays on even here (not just the installer's config) --
# nothing currently needs it for these clients, but there's no reason to
# force it off either.
xwayland {
    enabled = true
}

# Direct scanout -- Hyprland's own fast path for exactly this situation
# (a single, fullscreen, undecorated client -- vpinball's Table window,
# per the windowrule below, is precisely that): instead of compositing
# it normally, Hyprland hands the client's buffer straight to a DRM
# plane, skipping its own render pass entirely. Disabled here after a
# real report, confirmed via a WAYLAND_DEBUG=1 capture (see
# notes/vpinos.md step 5), of the nvidia proprietary driver (550.163.01
# -- see vpinos-sid.pref for why it's pinned there) completing real
# pageflips (the client got genuine wp_presentation_feedback round
# trips, proof the GPU-side commit succeeded, not just that the client
# thought it submitted a buffer) while the physical panel stayed black
# -- a known nvidia/direct-scanout mismatch (format/modifier handling
# differs from the normal composited path), not a Hyprland bug, not a
# monitor-detection problem (confirmed correct in the same capture), and
# not specific to any one client (vpinfe hits it too, per direct
# report). `render:explicit_sync` -- the usual other nvidia/Wayland
# suspect -- does NOT exist as a config key in this exact Hyprland build
# (confirmed via `strings` on the actual shipped /usr/bin/Hyprland,
# 0.55.2+ds -- it auto-negotiates via DRM syncobj-timeline capability
# instead, no override), so this is the real lever available.
# NOT YET CONFIRMED to fix it -- waiting on a real retest.
render {
    direct_scanout = false
}

# Hyprland's own default behavior (confirmed directly from a real log:
# "Disabling stdout logs! Check the log for further logs.") stops
# emitting anything useful almost immediately after startup -- the
# ASCII banner and a handful of manager-init lines is all that was
# landing in /var/log/vpinos-hyprland.log, cutting off right before
# monitor detection/output config/Xwayland startup, exactly the
# information needed while a real startup hang (multi-monitor,
# confirmed via launch.sh's own "timed out waiting for the
# compositor's Wayland socket" message, on a live boot with no
# persisted state) is still being tracked down. Paired with
# WAYLAND_DEBUG=1 (see launch.sh) for the lower-level raw protocol
# traffic too.
#
# disable_logs = false alone was NOT enough -- confirmed directly on a
# real 7.7MB/162k-line capture of this exact config in use: it was
# still 100% silent past "Disabling stdout logs!", for the entire
# session, despite Hyprland clearly still running (real Xwayland/client
# protocol traffic kept flowing in the same capture, from
# WAYLAND_DEBUG=1). `strings` on /usr/bin/Hyprland (0.55.2+ds, this
# image's exact build) turned up a second, separate key:
# debug:enable_stdout_logs -- disable_logs gates Hyprland's own log
# buffer/file entirely, enable_stdout_logs is the independent switch for
# whether any of that also reaches stdout, which is the only half
# launch.sh's `>>/var/log/vpinos-hyprland.log 2>&1` redirect can ever
# capture. Both are required together.
debug {
    disable_logs = false
    enable_stdout_logs = true
}

# Forces workspace 1 active right at startup -- without it Hyprland's
# own starting workspace isn't guaranteed to be 1 (matters for tools
# like vpinos-config.py that dispatch to specific scratch
# workspace numbers and expect a known starting state).
exec-once = hyprctl dispatch workspace 1

# Per-output workspace assignment -- which physical monitor shows
# workspace 1 (Table), 2 (Backglass), 3 (DMD). Written by
# vpinos-config.py's Save button, not hand-maintained -- empty
# until the cabinet builder actually runs it and picks a role for each
# detected monitor. Anything outside these markers is left alone; only
# the lines between them are replaced on save.
# BEGIN vpinos-workspace-monitors
# END vpinos-workspace-monitors

# Two harmless startup warnings Hyprland shows as on-screen toasts on
# every launch otherwise (confirmed on a real boot, both non-fatal --
# vpinball/vpinfe start fine either way, but a kiosk shouldn't ever show
# them): "Your system does not have hyprland-guiutils installed" (a
# separate package of desktop-oriented dialogs -- welcome screen, update
# notification, donate prompt -- none of which VPinOS wants or uses, so
# installing it just to silence the check isn't the right fix) and
# "Hyprland was started without start-hyprland" (that binary is a
# watchdog/supervisor that launches Hyprland as its own child and
# auto-restarts it on an unclean exit -- deliberately NOT used here,
# since launch.sh needs Hyprland `exec`'d directly so it becomes the tty
# session itself, the same libseat requirement weston had; a supervisor
# process in between would break that, and its auto-restart would likely
# fight launch.sh's own kill-compositor-on-client-exit logic). Both
# config keys found directly in the binary's own schema strings
# (`misc:disable_hyprland_guiutils_check`, `misc:disable_watchdog_warning`
# -- "watchdog" is literally what start-hyprland calls itself).
misc {
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    disable_splash_rendering = true
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# Hides the mouse cursor after 2s idle -- a kiosk cabinet has no mouse
# on screen during normal play (vpinball/vpinfe are keyboard/controller
# driven), so a visible pointer sitting over the table is just a
# distraction.
cursor {
    inactive_timeout = 2
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}

# Catch-all: force every window fullscreen, whatever it asks for.
# `no_border` (a windowrule property) does NOT exist in this Hyprland
# version -- confirmed directly on a real boot ("config option
# <windowrule:no_border> does not exist", vpinball/vpinfe both hit it,
# since both go through this shared kiosk config). Not needed anyway:
# `general { border_size = 0 }` above already removes borders globally,
# for every window, so there's nothing left for a per-window override to
# do here.
#
# Still needed even with the per-title rules below: those route VPinFE's
# windows to a workspace but don't set `fullscreen` themselves, so this
# is what actually makes them fullscreen -- and it's harmless for
# vpinball's own rules, which already set `fullscreen = 1` explicitly.
windowrule {
    name = kiosk-fullscreen
    match:class = .*
    fullscreen = 1
}

# Per-window-title routing to a specific workspace (workspace N == the
# Nth monitor, per the vpinos-workspace-monitors block above once it's
# been filled in). Matches by *title*, not app-id,
# since neither app sets a distinct app-id per window (vpinball reports
# "VPinballX_BGFX" for all three; vpinfe's Chrome windows only get a
# distinct identity via --class, which vpinfe doesn't pass) -- this is
# the whole reason the project migrated from weston to Hyprland in the
# first place (weston's kiosk-shell can only route by app-id). Titles
# ARE already distinct per window, confirmed on a real boot.
#
# `silent`: don't steal focus/switch the visible workspace just because
# the window opened -- these run in the kiosk config where the target
# workspace should already be the one showing on the right monitor by
# the time these apps start, unlike vpinos-config.py's own use
# of workspace-switching, which deliberately wants the switch visible.

# VPinFE -- match:class, using the real class strings confirmed from a
# side-by-side `hyprctl clients` capture of a broken run and a working
# run (not a guess): Chrome auto-generates
# `chrome-127.0.0.1__app_{bg,dmd,table}-Default` for these `--app=` URL
# windows itself, from the URL + profile -- it ignores whatever
# `--class=vpinfe-{bg,dmd,table}` vpinfe actually passes (which is
# exactly why that earlier attempt matched nothing, 100% of the time).
# This class string is IDENTICAL in both the broken and working
# captures, unlike `initialTitle`, which is why this is the reliable
# match target: on the broken run, `initialTitle` was still the loading
# URL (`127.0.0.1_/app/bg`) because the page's JS hadn't set
# `document.title` to "VPinFE BG" yet at Hyprland's first surface
# commit -- confirmed by the capture, not guessed -- while `class` was
# already correct from the very first commit both times. Root cause of
# the timing itself is still vpinfe's own page-load speed varying with
# OS disk-cache warmth (cold on the first boot-wide load, warm on every
# run after) -- see notes/vpinos.md's Open Decisions for the full
# history, including the confirmed-real screeninfo.get_monitors() bug
# in vpinfe's own source that this windowrule fix is unrelated to.
windowrule {
    name = VPinFE DMD
    match:class = ^chrome-127\.0\.0\.1__app_dmd-Default$
    workspace = 3 silent
}

windowrule {
    name = VPinFE BG
    match:class = ^chrome-127\.0\.0\.1__app_bg-Default$
    workspace = 2 silent
}

windowrule {
    name = VPinFE Table
    match:class = ^chrome-127\.0\.0\.1__app_table-Default$
    workspace = 1 silent
}

# VPinball
windowrule {
    name = dmd-vpinball-screen
    match:initial_title = ^Visual Pinball Score View$
    workspace = 3 silent
    fullscreen = 1
}

windowrule {
    name = bg-vpinball-screen
    match:initial_title = ^Visual Pinball Backglass$
    workspace = 2 silent
    fullscreen = 1
}

windowrule {
    name = table-vpinball-screen
    match:initial_title = ^Visual Pinball Player$
    workspace = 1 silent
    fullscreen = 1
}
