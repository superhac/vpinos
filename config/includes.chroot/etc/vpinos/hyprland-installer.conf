# Windowed config -- natural size, floating, normal decoration, for
# clients the user needs a visible, obvious way to close (the installer,
# VPXConfig) instead of a fixed-layout app stretched to fill the whole
# output. Matches the old weston-installer.ini/desktop-shell behavior.
# Used for client_name "installer" or "vpxconfig" (see launch.sh);
# filename predates the vpxconfig use, same as the old weston one did.
xwayland {
    enabled = true
}

# Forces workspace 1 active right at startup -- same reasoning as
# hyprland.conf's own copy of this line.
exec-once = hyprctl dispatch workspace 1

# Same two startup-warning suppressions as hyprland.conf -- these are
# compositor startup checks, not client-specific, so they'd otherwise
# show here too. See that file's comment for the full reasoning.
misc {
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    disable_splash_rendering = true
}

general {
    gaps_in = 4
    gaps_out = 8
}

# Catch-all: float instead of tile, so a single window doesn't get
# stretched to fill the output the way Hyprland's default tiling layout
# would do even without an explicit fullscreen rule. `float` ran on a
# real boot with no "config option does not exist" error (unlike
# `no_border` in hyprland.conf, which failed loudly the same way) --
# indirect confirmation it's a real property, though whether it actually
# produces a floating, correctly-sized window still hasn't been
# confirmed visually (the installer crashes at the Xwayland protocol
# level before that could be observed -- see the xwayland block above).
windowrule {
    name = windowed-float
    match:class = .*
    float = 1
}
