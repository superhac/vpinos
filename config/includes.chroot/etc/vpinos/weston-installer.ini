# Used only for the installer (launch.sh picks it when client_name is
# "installer"). The kiosk-shell in weston.ini forces every window
# fullscreen, which stretches Calamares' fixed-layout UI to the whole
# output -- badly on real displays bigger than a VM's, or not 4:3/16:9
# (e.g. a portrait playfield monitor). desktop-shell leaves the window at
# its natural size, centered. No panel, plain black background.
[core]
shell=desktop-shell.so

[shell]
panel-position=none
background-color=0xff000000
locking=false
