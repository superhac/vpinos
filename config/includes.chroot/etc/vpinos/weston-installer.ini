# Windowed weston config (filename predates this, but it's not
# installer-only anymore -- launch.sh picks it for client_name "installer"
# or "vpxconfig"). The kiosk-shell in weston.ini forces every window
# fullscreen, which stretches Calamares' fixed-layout UI to the whole
# output -- badly on real displays bigger than a VM's, or not 4:3/16:9
# (e.g. a portrait playfield monitor) -- and would leave vpxconfig with no
# visible way to close it. desktop-shell leaves the window at its natural
# size, centered. No panel, plain black background.
[core]
shell=desktop-shell.so

[shell]
panel-position=none
background-color=0xff000000
locking=false
