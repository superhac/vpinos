# Autologin as the hardcoded `vpinos` account on tty1 -- this is what
# actually takes effect on an INSTALLED system (live-config's own
# live-config-getty-generator only fires when `boot=live` is on the
# kernel cmdline, per its own Init() gate -- confirmed by reading its
# source -- so it never runs on a real installed boot at all, and this
# static override is the only mechanism in play there). On the LIVE
# image, live-config's dynamic generator takes precedence over this
# regardless (confirmed empirically during an earlier root-autologin
# test) -- see vpinos.md step 5 for why -- so this file is harmless
# there, not a conflict.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin vpinos --noclear %I $TERM
