# The image ships no SSH host keys, and on an installed system nothing
# creates them: live-config (which regenerates them at every live boot,
# its 1160-openssh-server step) is removed by the installer. Without keys
# the stock ExecStartPre `sshd -t` fails ("no hostkeys available") and
# ssh.service never starts.
# `ssh-keygen -A` creates only the missing keys and is a no-op otherwise,
# so every installed cabinet gets its own unique host keys on first boot.
# The empty ExecStartPre= resets the list so the keygen runs BEFORE sshd -t.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
