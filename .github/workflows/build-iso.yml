name: Build VPinOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    # No `paths:` filter here -- combining it with `tags:` is unreliable
    # (a tag push often has no computable diff against config/ paths,
    # since it just points at an existing commit), so this triggers on
    # every push to main plus every version tag, not just config
    # changes. Regular pushes still just build + upload artifacts for
    # verification; only a tag push (see the release job below)
    # actually creates a GitHub Release.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            lb_args: --binary-images iso-hybrid
            iso: live-image-amd64.hybrid.iso
          - arch: arm64
            runner: ubuntu-24.04-arm
            # syslinux, which iso-hybrid relies on, is x86 only.
            lb_args: --binary-images iso --bootloaders grub-efi
            iso: live-image-arm64.iso
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # live-build needs real free disk space for the chroot tree,
      # package cache, and the final ISO -- GitHub's default runners
      # ship several large toolchains this project never uses.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup
          docker image prune -af

      - name: Build vpinos-builder image
        run: docker build -t vpinos-builder .

      - name: lb config
        run: |
          docker run --rm --ulimit nofile=65536:65536 -v "$PWD:/work" -w /work vpinos-builder \
            lb config \
              --distribution trixie \
              --architectures ${{ matrix.arch }} \
              --linux-flavours ${{ matrix.arch }} \
              ${{ matrix.lb_args }} \
              --archive-areas "main contrib non-free non-free-firmware" \
              --backports true \
              --bootappend-live "boot=live components username=vpinos"

      # Only the directories lb config generates -- never the whole
      # project: chown -R over cache/ corrupts the bootstrap tree
      # live-build restores on every build (everything ends up owned by
      # the host uid, setuid bits stripped). See notes/vpinos.md step 2.
      - name: Fix ownership after lb config
        run: |
          docker run --rm -v "$PWD:/work" -w /work vpinos-builder sh -c \
            'for d in config auto local .build; do [ -e "$d" ] && chown -R '"$(id -u):$(id -g)"' "$d"; done; true'

      # lb build needs real root inside the container (mount/chroot/
      # debootstrap), so --privileged. tee masks the real exit code
      # (tee always exits 0), so pipefail + an explicit status check.
      - name: lb build
        run: |
          set -o pipefail
          docker run --rm --privileged --ulimit nofile=65536:65536 -v "$PWD:/work" -w /work vpinos-builder lb build \
            2>&1 | tee lb-build.log

      - name: Move build output to dist/
        if: always()
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/work" -w /work vpinos-builder sh -c \
            'mv live-image-${{ matrix.arch }}.* chroot.* binary.* dist/ 2>/dev/null; chown -R '"$(id -u):$(id -g)"' dist/' || true

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vpinos-iso-${{ matrix.arch }}
          path: dist/${{ matrix.iso }}
          retention-days: 14

      - name: Upload build manifests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vpinos-build-manifests-${{ matrix.arch }}
          path: |
            dist/live-image-${{ matrix.arch }}.contents
            dist/live-image-${{ matrix.arch }}.files
            dist/live-image-${{ matrix.arch }}.packages
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpinos-build-log-${{ matrix.arch }}
          path: lb-build.log
          retention-days: 14

  # Only an actual version tag (e.g. v1.0.0) creates a real GitHub
  # Release -- pushes to main just build + upload artifacts above,
  # for CI verification. One job after both builds publishes it, so the
  # two builds never race to create the same release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the ISOs
        uses: actions/download-artifact@v4
        with:
          pattern: vpinos-iso-*
          merge-multiple: true
          path: dist

      - name: Download the build manifests
        uses: actions/download-artifact@v4
        with:
          pattern: vpinos-build-manifests-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
